<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Pullux</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f0f2f5;padding:20px}h1{color:#1a1a1a;margin-bottom:2rem;font-size:2.5em;letter-spacing:-1px}form{background:#fff;padding:2.5rem;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.05);width:100%;max-width:400px}input[type=password],input[type=text]{width:100%;padding:12px 16px;margin-bottom:1.5rem;border:2px solid #e0e0e0;border-radius:8px;font-size:16px;transition:border-color .3s}input[type=password]:focus,input[type=text]:focus{outline:0;border-color:#007bff;box-shadow:0 0 0 3px rgba(0,123,255,.1)}label{display:block;margin-bottom:.5rem;color:#404040;font-weight:500}input[type=submit]{width:100%;padding:14px;background:#007bff;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:background .3s}input[type=submit]:hover{background:#0056b3}@media (max-width:480px){form{padding:1.5rem}h1{font-size:2em}}</style></head><body><h1>Login</h1><form action=/login method=post>Username: <input type=text name=username><br>Password: <input type=password name=password><br><input type=submit value=Login></form></body></html>
